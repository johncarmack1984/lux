# Builds the lux-node binaries and stages them as artifacts — dispatch it,
# download lux-node-x86_64-linux, lux-node-aarch64-linux, or lux-node-macos,
# and follow apps/node/README.md. The Linux builds are static musl, the same
# toolchain the Lambda deploys use; the macOS one is a universal binary. Nothing
# here touches AWS or signs anything, so it is safe to run from any ref.
#
# Each Linux target builds natively on a runner of its own arch: Ubuntu's
# musl-tools only ships musl-gcc for the host arch, so cross-compiling would
# mean a hand-rolled toolchain instead of the distro package.
name: node-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: lux-node-x86_64-linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            artifact: lux-node-aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-targets: "false"
          key: ${{ matrix.target }}

      - name: Build (static musl)
        run: cargo build --release --target ${{ matrix.target }} -p lux-node

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/lux-node
          if-no-files-found: error

  # One universal binary (Apple silicon + Intel), the release's lux-node-macos.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-targets: "false"
          key: lux-node-macos

      - name: Build (aarch64 + x86_64)
        run: cargo build --release --target aarch64-apple-darwin --target x86_64-apple-darwin -p lux-node

      - name: Stage the universal binary
        run: |
          lipo -create -output lux-node-macos \
            target/aarch64-apple-darwin/release/lux-node \
            target/x86_64-apple-darwin/release/lux-node
          lipo -info lux-node-macos

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lux-node-macos
          path: lux-node-macos
          if-no-files-found: error
